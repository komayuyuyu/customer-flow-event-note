name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-validate:
    name: Test and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          for file in ./*.js; do
            node --check "$file"
          done

      - name: Check JSON syntax
        run: python -c "import json, pathlib; [json.loads(path.read_text(encoding='utf-8')) for path in pathlib.Path('data').glob('*.json')]"

      - name: Check maintainability and accessibility contracts
        run: python scripts/check_project_contracts.py

      - name: Build Firebase Hosting bundle
        run: node scripts/build-hosting.mjs
